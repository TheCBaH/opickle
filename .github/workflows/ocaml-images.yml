name: OCaml Images

on:
  push:
    branches:
      - main
      - devel
    paths:
      - '.devcontainer/**'
      - '.github/workflows/ocaml-images.yml'
  workflow_dispatch:

jobs:
  devcontainer:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: image
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      with:
        password: ${{ secrets.GITHUB_TOKEN }}
